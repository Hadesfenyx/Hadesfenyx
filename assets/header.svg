<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hades — AI Developer">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1000" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#131a2b"/>
      <stop offset="1" stop-color="#1a1b27"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0" y1="0" x2="500" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="0.5" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#7dcfff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1000 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7aa2f7" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>

    <radialGradient id="orbBlue">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbPurple">
      <stop offset="0" stop-color="#bb9af7" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#bb9af7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbCyan">
      <stop offset="0" stop-color="#7dcfff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7dcfff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1000" height="260" rx="16" fill="url(#bgGrad)"/>
  <rect width="1000" height="260" rx="16" fill="url(#grid)"/>

  <!-- floating glow orbs -->
  <circle cx="150" cy="70" r="120" fill="url(#orbBlue)">
    <animate attributeName="cx" values="150;240;150" dur="13s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="70;150;70" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="860" cy="190" r="140" fill="url(#orbPurple)">
    <animate attributeName="cx" values="860;750;860" dur="15s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="190;80;190" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="520" cy="240" r="100" fill="url(#orbCyan)">
    <animate attributeName="cx" values="520;600;440;520" dur="17s" repeatCount="indefinite"/>
  </circle>

  <!-- decorative code glyphs -->
  <g font-family="'Fira Code','Courier New',monospace" font-size="14" fill="#3d59a1">
    <text x="48" y="212" opacity="0.9">&lt;/&gt;</text>
    <text x="928" y="56" opacity="0.9">{ }</text>
    <text x="80" y="52" opacity="0.7">01</text>
    <text x="900" y="222" opacity="0.7">ai</text>
  </g>

  <!-- name with animated gradient -->
  <text x="500" y="126" text-anchor="middle"
        font-family="'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif"
        font-size="68" font-weight="800" letter-spacing="12"
        fill="url(#textGrad)">HADES</text>

  <!-- subtitle -->
  <text x="500" y="170" text-anchor="middle"
        font-family="'Fira Code','Courier New',monospace"
        font-size="16" letter-spacing="4" fill="#a9b1d6">AI DEVELOPER · FULL-STACK · 3+ YEARS</text>

  <!-- gradient underline -->
  <rect x="400" y="188" width="200" height="3" rx="1.5" fill="url(#textGrad)"/>

  <!-- terminal prompt with blinking cursor -->
  <text x="384" y="230" font-family="'Fira Code','Courier New',monospace" font-size="14" fill="#565f89">$ building the future with AI</text>
  <rect x="632" y="217" width="9" height="16" rx="1" fill="#7aa2f7">
    <animate attributeName="opacity" values="1;0" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
</svg>
